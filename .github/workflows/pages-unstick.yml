name: Lossa fastnad publicering
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "ID för den fastnade publiceringen (commit-sha)"
        required: true
permissions:
  pages: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/${{ inputs.deployment }}/cancel" -w "\nHTTP %{http_code}\n"

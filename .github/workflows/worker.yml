name: Cloudflare Worker (mml.kummel.app)
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Publicera Worker och sätt MML-nyckeln
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          MML_KEY: ${{ secrets.MML_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$MML_KEY" ]; then echo "Hemligheterna CF_API_TOKEN och MML_KEY saknas än" | tee -a $GITHUB_STEP_SUMMARY; exit 0; fi
          npx --yes wrangler@3.99.0 deploy
          printf '%s' "$MML_KEY" | npx --yes wrangler@3.99.0 secret put MML_KEY
      - name: Prova en ruta
        run: |
          sleep 20
          curl -s -o /dev/null -w "ortokuva z14: %{http_code} %{size_download} B\n" -H "Origin: https://www.kummel.app" -H "Referer: https://www.kummel.app/" https://mml.kummel.app/ortokuva/14/4644/9106.jpg | tee -a $GITHUB_STEP_SUMMARY

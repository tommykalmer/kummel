name: Sjökortsdata – provbygge större område
# Bygger sjökortet för ett valfritt område utan att spara i repot. Visar filstorlekar och laddar upp resultatet som artefakt.
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Område lon_min,lat_min,lon_max,lat_max"
        required: true
        default: "19.0,59.65,25.95,60.75"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CHART_BBOX: ${{ inputs.bbox }}
    steps:
      - uses: actions/checkout@v4
      - name: Installera tippecanoe
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq tippecanoe; then
            git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
            make -C /tmp/tippecanoe -j"$(nproc)" && sudo make -C /tmp/tippecanoe install
          fi
          pip install --quiet --break-system-packages shapely || pip install --quiet shapely
      - run: python3 scripts/fetch_chart.py
      - run: python3 scripts/fetch_mml.py
      - run: bash scripts/build_tiles.sh
      - name: Storlekar
        run: |
          ls -la data/ | tee -a $GITHUB_STEP_SUMMARY
          du -sh build 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: chart-test, path: data/, retention-days: 7 }

<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Kummel</title>
<meta name="description" content="Sjökort, väder och båtliv i skärgården – i webbläsaren, på mobil, iPad och dator.">
<meta name="theme-color" content="#0f2a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2a3d'/%3E%3Cpath d='M32 10 46 50H18Z' fill='%23f2c14e'/%3E%3Cpath d='M22 40h20' stroke='%230f2a3d' stroke-width='4'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed chart; floating top bar + tool rail; bottom sheet on phone, left side panel on desktop */
:root{
  --ink:#0f2a3d;        /* chart navy */
  --paper:#f7f5ee;      /* chart paper */
  --panel:rgba(250,249,244,.94);
  --line:#d8d4c6;
  --fg:#14232e;
  --muted:#5d6b73;
  --signal:#f2c14e;     /* buoy yellow */
  --port:#d64545;       /* red / warning */
  --stbd:#2f8f5b;       /* green / ok */
  --water:#cfe4ee;
  --accent:#1d6fa3;
  --shadow:0 6px 24px rgba(15,42,61,.18);
  --f-ui:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --r:14px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1a23;--panel:rgba(16,32,44,.94);--line:#2a4252;--fg:#e6edf0;--muted:#93a5ae;
  --water:#183244;--accent:#5fb0e0;--ink:#081620;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1a23;--panel:rgba(16,32,44,.94);--line:#2a4252;--fg:#e6edf0;--muted:#93a5ae;
  --water:#183244;--accent:#5fb0e0;--ink:#081620;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--fg);font:15px/1.4 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:var(--water)}
.maplibregl-ctrl-attrib{font-size:10px;background:var(--panel)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--accent)}
.maplibregl-ctrl-bottom-left{bottom:calc(4px + var(--sab));left:var(--sal)}
.maplibregl-ctrl-bottom-right{bottom:var(--sab);right:var(--sar)}
.maplibregl-ctrl-scale{background:var(--panel);border-color:var(--fg);color:var(--fg);font:600 11px var(--f-ui)}
.maplibregl-canvas:focus{outline:none}

/* top bar */
#top{position:fixed;z-index:500;top:calc(10px + var(--sat));left:calc(10px + var(--sal));right:calc(10px + var(--sar));
  display:flex;gap:8px;align-items:center;pointer-events:none}
#top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 12px;box-shadow:var(--shadow);
  font:700 18px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.brand svg{width:20px;height:20px}
.modes{display:flex;gap:4px;background:var(--panel);border-radius:var(--r);padding:4px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none;min-width:0}
.modes::-webkit-scrollbar{display:none}
.modes button{border:0;background:transparent;border-radius:10px;padding:6px 10px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
:root[data-theme="dark"] .modes button[aria-pressed="true"]{background:var(--accent);color:#081620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .modes button[aria-pressed="true"]{background:var(--accent);color:#081620}}
.spacer{flex:1}

/* weather chip */
#wxchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:0;border-radius:var(--r);padding:6px 12px;box-shadow:var(--shadow);cursor:pointer;
  font:600 16px/1 var(--f-num);font-variant-numeric:tabular-nums}
#wxchip .arrow{width:22px;height:22px;transition:transform .4s}
#wxchip small{font:500 12px var(--f-ui);color:var(--muted)}

/* rail */
#rail{position:fixed;z-index:500;right:calc(10px + var(--sar));top:calc(70px + var(--sat));display:flex;flex-direction:column;gap:8px}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.rb svg{width:22px;height:22px}
.rb[aria-pressed="true"]{background:var(--accent);color:#fff}
.rb.course{background:var(--signal);color:#1b1500}
.rb:focus-visible,.modes button:focus-visible,.btn:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* crosshair */
#cross{color:var(--fg);position:fixed;z-index:400;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;pointer-events:none;opacity:.7}
body.plan #cross{opacity:1}

/* instruments */
#inst{position:fixed;z-index:500;left:calc(10px + var(--sal));bottom:calc(36px + var(--sab));display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 90px)}
.gauge{background:var(--panel);border-radius:12px;padding:6px 10px;box-shadow:var(--shadow);min-width:72px}
.gauge b{display:block;font:700 24px/1 var(--f-num);font-variant-numeric:tabular-nums}
.gauge span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gauge.pos b{font-size:15px;font-weight:600;line-height:1.15}

/* big action buttons */
#fab{position:fixed;z-index:500;right:calc(10px + var(--sar));bottom:calc(36px + var(--sab));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{border:0;border-radius:28px;min-height:56px;padding:0 20px;font:700 18px var(--f-num);letter-spacing:.04em;text-transform:uppercase;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab.fish{background:var(--signal);color:#1b1500}
.fab.rec{background:var(--panel);color:var(--fg)}
.fab.rec.on{background:var(--port);color:#fff}
.fab.mob{background:var(--port);color:#fff;min-height:44px;font-size:15px;padding:0 14px}
.fab svg{width:22px;height:22px}

#b-follow{position:fixed;z-index:520;left:50%;transform:translateX(-50%);bottom:calc(120px + var(--sab));border:0;border-radius:24px;padding:12px 20px;background:var(--accent);color:#fff;font:700 16px var(--f-num);letter-spacing:.05em;text-transform:uppercase;box-shadow:var(--shadow);cursor:pointer}
#wxbar{position:fixed;z-index:510;top:calc(64px + var(--sat));left:calc(10px + var(--sal));right:calc(70px + var(--sar));max-width:520px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.wxb-top{display:flex;align-items:center;gap:8px}.wxb-top b{font:700 17px var(--f-num)}.wxb-top .x{margin-left:auto;width:30px;height:30px}
#wxb-range{width:100%;accent-color:var(--accent)}
.wxb-modes{display:flex;gap:3px;background:var(--paper);border-radius:9px;padding:2px}.wxb-modes button{border:0;background:transparent;border-radius:7px;padding:4px 10px;font-weight:600;color:var(--muted);cursor:pointer}.wxb-modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sst-scale{display:inline-block;width:70px;height:10px;border-radius:5px;background:linear-gradient(90deg,#3b4cc0,#5b8ff9,#3fb6c7,#4cc38a,#e8c547,#f08a3c,#d63e3e)}
.wxb-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.wxb-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#navbar{position:fixed;z-index:515;top:calc(64px + var(--sat));left:calc(10px + var(--sal));right:calc(70px + var(--sar));max-width:520px;background:var(--ink);color:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
#navbar .muted{color:#b9c7cf}.nav-main{display:flex;align-items:center;gap:12px}.nav-main>div:first-child{flex:1;min-width:0}
.nav-big{display:flex;gap:14px;white-space:nowrap;font:700 30px/1.05 var(--f-num);font-variant-numeric:tabular-nums}.nav-eta{text-align:right}.nav-eta b{display:block;font:700 26px/1 var(--f-num)}
#navbar .x{color:#fff}#nav-xte{color:var(--signal);font-weight:600;font-size:13px}#nav-xte:empty{display:none}
body:has(#navbar:not(.hidden)) #wxbar{top:calc(170px + var(--sat))}
body:has(#navbar:not(.hidden)) .toast{top:auto;bottom:calc(130px + var(--sab))}
/* sheet / panel */
#sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;max-height:72%;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;
  padding-bottom:var(--sab)}
#sheet.open{transform:none}
#sheet.compact{max-height:34%}
/* phone: the tool rail stays reachable above an open sheet; sheet content keeps clear of it */
@media (max-width:899px){
  #rail{z-index:650}
  body.sheet-open .sh-body,body.sheet-open .sh-head{padding-right:calc(70px + var(--sar))}
  body.sheet-open #fab,body.sheet-open #inst{visibility:hidden}
}
@media (min-width:900px){
  #sheet{left:calc(10px + var(--sal));right:auto;top:calc(70px + var(--sat));bottom:calc(10px + var(--sab));width:390px;max-height:none;border-radius:18px;transform:translateX(-110%)}
  #sheet.open{transform:none}
  #sheet.compact{max-height:none}
  body.sheet-open #inst{left:420px}
}
.sh-head{display:flex;align-items:center;gap:8px;padding:12px max(16px,var(--sal)) 8px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font:700 20px var(--f-num);letter-spacing:.03em;text-transform:uppercase;flex:1;text-wrap:balance}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
@media (min-width:900px){.grab{display:none}}
.sh-body{overflow:auto;padding:12px max(16px,var(--sal)) 16px max(16px,var(--sar));display:flex;flex-direction:column;gap:12px}
.x{border:0;background:transparent;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:22px;color:var(--muted)}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.warn{color:var(--port);border-color:var(--port)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.card h3{margin:0;font:600 17px var(--f-num);letter-spacing:.02em}
.list{display:flex;flex-direction:column;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--paper);color:var(--fg);font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.big{font:700 34px/1 var(--f-num);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}
.pill.ok{background:var(--stbd);color:#fff}.pill.bad{background:var(--port);color:#fff}.pill.mid{background:var(--signal);color:#1b1500}
.wx-now{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.wx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx-stats div{background:var(--paper);border-radius:10px;padding:6px 8px}
.wx-stats b{display:block;font:700 19px var(--f-num);font-variant-numeric:tabular-nums}
.wx-stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chart{width:100%;overflow-x:auto}
.callout{border-radius:12px;padding:10px 12px;background:var(--paper);border-left:4px solid var(--accent)}
.callout.ok{border-color:var(--stbd)}.callout.bad{border-color:var(--port)}
.leg{display:grid;grid-template-columns:28px 1fr auto auto;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;z-index:900;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;max-width:90vw}
#night{position:fixed;inset:0;z-index:2000;pointer-events:none;background:#b00000;mix-blend-mode:multiply;display:none}
body.night #night{display:block}
body.night{filter:brightness(.65)}
.wp-icon{width:22px;height:22px;border-radius:50%;background:var(--signal);color:#1b1500;border:2px solid var(--ink);display:grid;place-items:center;font:700 12px var(--f-num)}
.pl-icon{padding:0;cursor:pointer;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pl-icon span{transform:rotate(45deg);font-size:15px;line-height:1}
.boat-icon{width:34px;height:34px}
.disclaimer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.hidden{display:none!important}
@media (max-width:520px){.brand .bt{display:none}#wxchip small{display:none}
  .fab.rec{width:56px;padding:0;justify-content:center}.fab.rec span{display:none}
  #inst{max-width:calc(100% - 86px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Sjökort"></div>

<svg id="cross" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 0v8M14 20v8M0 14h8M20 14h8" stroke="currentColor" stroke-width="2"/></svg>

<div id="top">
  <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 2 20 21H4Z" fill="#f2c14e"/><path d="M7.5 16h9" stroke="#0f2a3d" stroke-width="2"/></svg><span class="bt">Kummel</span></div>
  <div class="modes" role="group" aria-label="Läge">
    <button data-mode="tur" aria-pressed="true">Utflykt</button>
    <button data-mode="fiske" aria-pressed="false">Fiske</button>
    <button data-mode="segling" aria-pressed="false">Segling</button>
    <button data-mode="paddling" aria-pressed="false">Paddling</button>
  </div>
  <div class="spacer"></div>
  <button id="wxchip" aria-label="Väder"><svg class="arrow" viewBox="0 0 24 24"><path d="M12 3 18 20 12 16 6 20Z" fill="currentColor"/></svg><span id="wxtxt">–</span><small id="wxsub">väder</small></button>
</div>

<div id="rail">
  <button class="rb hidden" id="b-north" title="Norr upp"><svg id="north" viewBox="0 0 24 24"><path d="M12 2 17 13H7Z" fill="#d64545"/><path d="M12 22 7 13h10Z" fill="currentColor" opacity=".45"/></svg></button>
  <button class="rb" id="b-locate" title="Min position" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="rb" id="b-route" title="Planera rutt" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 18c6-1 2-9 10-11"/></svg></button>
  <button class="rb hidden" id="b-depth" title="Djupintervall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6c3 0 3 2 6 2s3-2 6-2 3 2 6 2"/><path d="M6 12h12M8 17h8"/></svg></button>
  <button class="rb" id="b-place" title="Ny plats vid korset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><path d="M12 7v6M9 10h6"/></svg></button>
  <button class="rb" id="b-wx" title="Sjöväder på kartan" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg></button>
  <button class="rb" id="b-layers" title="Kartlager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="rb" id="b-menu" title="Meny"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="rb" id="b-night" title="Nattläge" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
</div>

<div id="inst">
  <div class="gauge"><b id="g-sog">–</b><span>Fart kn</span></div>
  <div class="gauge"><b id="g-cog">–</b><span>Kurs °</span></div>
  <div class="gauge pos"><b id="g-pos">–</b><span id="g-poslbl">Kors</span></div>
</div>

<button id="b-follow" class="hidden">Följ båten</button>
<div id="navbar" class="hidden" role="status">
  <div class="nav-main"><div><span id="nav-to" class="muted">–</span><div class="nav-big"><b id="nav-brg">–</b><b id="nav-dtw">–</b></div></div>
  <div class="nav-eta"><span class="muted">Framme</span><b id="nav-eta">–</b></div><button class="x" id="nav-stop" aria-label="Avsluta navigering">×</button></div>
  <div id="nav-rest" class="muted"></div><div id="nav-xte"></div>
</div>
<div id="wxbar" class="hidden"><div class="wxb-top"><b id="wxb-time">Nu</b><span class="wxb-modes"><button data-wxm="wind" aria-pressed="true">Vind</button><button data-wxm="water" aria-pressed="false">Vatten°</button></span><button class="x" id="wxb-close" aria-label="Stäng väderlagret">×</button></div><input type="range" id="wxb-range" min="0" max="47" step="1" value="0" aria-label="Tid för prognosen"><div id="wxb-sub" class="muted" style="font-size:12px"></div><div class="wxb-legend" id="wxb-legend-wind"><span><i style="background:var(--stbd)"></i>under din gräns</span><span><i style="background:var(--signal)"></i>nära</span><span><i style="background:var(--port)"></i>över</span><span><b>Stor pil</b> = uppmätt nu</span></div><div class="wxb-legend hidden" id="wxb-legend-water"><span class="sst-scale"></span><span>0°</span><span>8°</span><span>16°</span><span>24°</span><span><b>Mörk ring</b> = uppmätt</span></div></div>
<div id="fab">
  <button class="fab mob hidden" id="b-mob" title="Man överbord">MOB</button>
  <button class="fab fish hidden" id="b-fish"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 12c3-4 7-6 11-6 4 0 7 3 8 6-1 3-4 6-8 6-4 0-8-2-11-6zm15-1a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM2 12 0 8v8z"/></svg>Fisk!</button>
  <button class="fab rec" id="b-rec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg><span>Spela in</span></button>
</div>

<section id="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="sh-title">–</h2><button class="x" id="sh-close" aria-label="Stäng">×</button></div>
  <div class="sh-body" id="sh-body"></div>
</section>
<div id="night"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="chartstyle.js"></script>
<script src="app.js"></script>
</body>
</html>
